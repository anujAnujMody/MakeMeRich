[project]
name = "trading-engine"
version = "0.1.0"
description = "Personal algo-trading engine for Indian index options (NIFTY/BANKNIFTY/SENSEX)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<0.21",
    "pandas>=2.2,<3",
    "pyarrow>=18.0,<19",
    "numpy>=1.26,<3",
    "httpx>=0.27,<0.28",
    "websockets>=13.0,<14",
    "apscheduler>=3.11,<4",
    "structlog>=24.4,<25",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
    "purgedcv==0.1.2",
    "scikit-learn>=1.5,<2",
    "xgboost>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-PyYAML>=6.0,<7",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Measured coverage of `te` is 96% (4240 statements, 186 missed). The
# `--cov-fail-under` floor is deliberately set at 90, NOT at the current 96:
# a floor exists to catch a real regression, not to fail the build on
# ordinary churn. It is a figure the suite genuinely clears today with room
# to spare — never a threshold set above what actually passes.
addopts = "--cov=te --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N806"]
"te/api/schemas/*.py" = ["N815"]
# `l` mirrors the bar schema's OHLCV column naming (o/h/l/c/v) used
# throughout te/data — ambiguous-variable-name would fire on every bar row.
"te/data/recorder.py" = ["E741"]
"tests/data/test_barstore.py" = ["E741"]
"tests/data/test_asof.py" = ["E741"]
"tests/strategy/test_context.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Third-party libraries with no shipped stubs/py.typed marker — best-effort
# mypy per the plan ("don't block on third-party typing friction, keep our
# own code clean"). Our own modules that use these are still checked
# --strict; only the untyped import boundary itself is silenced.
[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "apscheduler.*", "scipy.*", "purgedcv.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["te*"]

[tool.importlinter]
root_packages = ["te"]

[[tool.importlinter.contracts]]
name = "domain is pure — imports nothing else from te"
type = "forbidden"
source_modules = ["te.domain"]
forbidden_modules = [
    "te.data",
    "te.broker",
    "te.execution",
    "te.risk",
    "te.strategy",
    "te.ml",
    "te.engine",
    "te.backtest",
    "te.persistence",
    "te.api",
]

[[tool.importlinter.contracts]]
name = "data/broker stay in the data tier — no upward te.* imports"
type = "forbidden"
source_modules = ["te.data", "te.broker"]
forbidden_modules = [
    "te.persistence",
    "te.risk",
    "te.strategy",
    "te.ml",
    "te.engine",
    "te.backtest",
    "te.execution",
    "te.api",
]

[[tool.importlinter.contracts]]
name = "strategy may never import ml — ML cannot generate a signal"
type = "forbidden"
source_modules = ["te.strategy"]
forbidden_modules = ["te.ml"]

[[tool.importlinter.contracts]]
name = "nothing imports api"
type = "forbidden"
source_modules = [
    "te.domain",
    "te.data",
    "te.broker",
    "te.execution",
    "te.risk",
    "te.strategy",
    "te.ml",
    "te.engine",
    "te.backtest",
    "te.persistence",
]
forbidden_modules = ["te.api"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
