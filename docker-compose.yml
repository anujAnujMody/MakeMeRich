services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      openalgo:
        condition: service_started
      engine:
        condition: service_started
    restart: unless-stopped

  openalgo:
    image: marketcalls/openalgo:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    shm_size: 512m
    volumes:
      - ./db:/app/db
      - ./log:/app/log
      - ./strategies:/app/strategies
      - ./.env:/app/.env:ro
    environment:
      - FLASK_HOST_IP=0.0.0.0
      - WEBSOCKET_HOST=0.0.0.0
      - ZMQ_HOST=0.0.0.0
      - MASTER_CONTRACT_CUTOFF_TIME=23:59
    restart: unless-stopped

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TE_ENV=${TE_ENV:-dev}
      - TE_DATABASE_URL=${TE_DATABASE_URL:-sqlite:////app/data/dev.db}
      - TE_BAR_STORE_PATH=${TE_BAR_STORE_PATH:-/app/data/bars}
      - TE_OPENALGO_HOST=${TE_OPENALGO_HOST:-http://openalgo:5000}
      # OpenAlgo's WebSocket endpoint. Configured separately from
      # TE_OPENALGO_HOST on purpose — the REST host already carries its own
      # port, and the two can be different hosts entirely in production.
      # The `openalgo` service publishes WS on 8765 (see ZMQ/WS config above).
      - TE_OPENALGO_WS_HOST=${TE_OPENALGO_WS_HOST:-ws://openalgo:8765}
      - TE_OPENALGO_API_KEY=${OPENALGO_API_KEY}
      - TE_CORS_ORIGINS=${TE_CORS_ORIGINS:-["http://localhost:8080"]}
    volumes:
      - engine-data:/app/data
    restart: unless-stopped

volumes:
  engine-data:

