services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      openalgo:
        condition: service_started
      engine:
        condition: service_started
    restart: unless-stopped

  openalgo:
    image: marketcalls/openalgo:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    shm_size: 512m
    volumes:
      - ./db:/app/db
      - ./log:/app/log
      - ./strategies:/app/strategies
      - ./.env:/app/.env:ro
    environment:
      - FLASK_HOST_IP=0.0.0.0
      - WEBSOCKET_HOST=0.0.0.0
      - ZMQ_HOST=0.0.0.0
      - MASTER_CONTRACT_CUTOFF_TIME=23:59
    restart: unless-stopped

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TE_ENV=${TE_ENV:-dev}
      - TE_DATABASE_URL=${TE_DATABASE_URL:-sqlite:////app/data/dev.db}
      - TE_BAR_STORE_PATH=${TE_BAR_STORE_PATH:-/app/data/bars}
      - TE_OPENALGO_HOST=${TE_OPENALGO_HOST:-http://openalgo:5000}
      # OpenAlgo's WebSocket endpoint. Configured separately from
      # TE_OPENALGO_HOST on purpose — the REST host already carries its own
      # port, and the two can be different hosts entirely in production.
      # The `openalgo` service publishes WS on 8765 (see ZMQ/WS config above).
      - TE_OPENALGO_WS_HOST=${TE_OPENALGO_WS_HOST:-ws://openalgo:8765}
      - TE_OPENALGO_API_KEY=${OPENALGO_API_KEY}
      - TE_CORS_ORIGINS=${TE_CORS_ORIGINS:-["http://localhost:8080"]}
      # Daily automated OpenAlgo-app + Angel-broker relogin (te.broker.openalgo_login,
      # te.engine.scheduler's "openalgo_relogin" job, 08:40 IST) — all five
      # optional in Settings, so an unset value here just means the job
      # skips with a logged reason rather than crashing the engine.
      - TE_OPENALGO_APP_USERNAME=${OPENALGO_APP_USERNAME:-}
      - TE_OPENALGO_APP_PASSWORD=${OPENALGO_APP_PASSWORD:-}
      - TE_ANGEL_CLIENT_ID=${CLIENT_ID:-}
      - TE_ANGEL_PIN=${PIN:-}
      - TE_ANGEL_TOTP_SECRET=${TOTP_SECRET:-}
      # Without this, `paper_cycle_instruments` defaults to an empty tuple
      # and the paper-trading cycle job runs on schedule but is a documented
      # no-op every time — bars still record, but ORB never evaluates a
      # signal. NIFTY only for now: CycleConfig has a single `exchange`/
      # `lot_size` for its whole instrument list, so NIFTY+SENSEX (NFO vs
      # BFO, different lot sizes) can't both go in this one config yet.
      - TE_PAPER_CYCLE_INSTRUMENTS=${TE_PAPER_CYCLE_INSTRUMENTS:-["NIFTY"]}
      # SEED ONLY — in paise (Paise is always integer paise, see
      # te/domain/money.py, never a float rupee amount). This value is used
      # ONCE, to populate `engine_state.capital_paise` the first time this
      # container starts against a brand-new database. Every real paper
      # cycle after that reads the STORED value via `get_guardrails`
      # (te/engine/state.py), which is edited from the dashboard's Account
      # Guardrails card and survives restarts/redeploys untouched — this
      # env var is then completely ignored for trading. Changing it here
      # does NOT change a running account's capital; the engine logs a
      # WARNING at startup (te.engine.scheduler.
      # _warn_if_stored_guardrails_diverge_from_settings) whenever this
      # value disagrees with what is actually stored, precisely because that
      # was found live: this was set to Rs 20,000 while a stored Rs 50,000
      # governed every real cycle, with nothing anywhere saying so. To
      # change the live capital, edit it on the dashboard, not here.
      - TE_PAPER_CYCLE_CAPITAL_PAISE=${TE_PAPER_CYCLE_CAPITAL_PAISE:-2000000}
    volumes:
      - engine-data:/app/data
    restart: unless-stopped

volumes:
  engine-data:

